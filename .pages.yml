# Pages CMS 配置 - 手机/网页端可视化编辑，自动提交到 GitHub
# https://pagescms.org/docs/configuration/
media:
  # 文章富文本图片的默认上传位置
  - name: uploads
    label: 文章图片
    input: public/uploads
    output: /uploads
    categories: [image]
    rename: random
  # 说说配图上传位置
  - name: shuoshuo-images
    label: 说说图片
    input: public/shuoshuo/images
    output: /shuoshuo/images
    categories: [image]
    rename: random

content:
  # ------------------------------------------------------------------
  # 说说
  # ------------------------------------------------------------------
  - name: shuoshuo
    label: 说说
    type: collection
    path: src/content/shuoshuo
    format: yaml-frontmatter
    # 文件名用时间戳，保证唯一且无需手动填写
    filename: "{year}{month}{day}-{hour}{minute}{second}.md"
    fields:
      - name: date
        label: 时间
        type: date
        required: true
        options:
          time: true
          # 带 +08:00 时区偏移，避免日期被按 UTC 解析导致时间偏移 8 小时
          format: yyyy-MM-dd'T'HH:mm:ssxxx
      - name: tags
        label: 标签
        type: string
        list: true
      - name: image
        label: 配图
        type: image
        options:
          media: shuoshuo-images
      - name: body
        label: 内容
        type: rich-text
    view:
      primary: date
      sort: date
      order: desc

  # ------------------------------------------------------------------
  # 文章
  # ------------------------------------------------------------------
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: create
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: slug
        label: 文件名（英文短横线）
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      - name: published
        label: 发布日期
        type: date
        required: true
      - name: updated
        label: 更新日期
        type: date
        default: ""
      - name: description
        label: 摘要
        type: text
      - name: category
        label: 分类
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        type: boolean
      - name: pinned
        label: 置顶
        type: boolean
      - name: body
        label: 正文
        type: rich-text
    view:
      primary: title
      sort: published
      order: desc
